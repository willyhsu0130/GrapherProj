# ===============================================================
# 1. CORE APPLICATION SETTINGS
# ===============================================================
spring.application.name=grapher
spring.profiles.active=dev
frontend.url=${FRONTEND_URL:http://localhost:5173}
jwt.secret=${JWT_SECRET}

# ===============================================================
# 2. DATABASE CONNECTION (PostgreSQL / Supabase)
# ===============================================================
spring.datasource.driver-class-name=org.postgresql.Driver
# Note: Ensure your URL uses Port 6543 for Supabase Transaction Mode
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================================================
# 3. HIKARI CONNECTION POOL (CRITICAL FOR SUPABASE)
# ===============================================================
# Tight pool size forces you to write clean @Transactional code
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1

# How long to wait for a connection before failing (30s)
spring.datasource.hikari.connection-timeout=30000

# Connection maintenance (Supabase prefers these kept relatively short)
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

# Logs a stack trace if a method holds a connection longer than 2s
spring.datasource.hikari.leak-detection-threshold=2000

# ===============================================================
# 4. JPA / HIBERNATE OPTIMIZATION
# ===============================================================
# Forces connections to close after Service layer, not Controller.
spring.jpa.open-in-view=false

# ===============================================================
# 5. LOGGING LEVELS
# ===============================================================
logging.level.com.example.grapher=DEBUG
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN